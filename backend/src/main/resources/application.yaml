ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.kanjimasta.ApplicationKt.module

database:
  url: "$DATABASE_URL:"
  maxPoolSize: "$HIKARI_MAX_POOL_SIZE:7"

supabase:
  url: "$SUPABASE_URL:"
  serviceRoleKey: "$SUPABASE_SERVICE_ROLE_KEY:"

cors:
  allowedOrigins: "$CORS_ALLOWED_ORIGINS:"

photoAnalysis:
  jobName: "$PHOTO_ANALYSIS_JOB:"

quizGeneration:
  jobName: "$QUIZ_GENERATION_JOB:"

localJobs:
  dispatchUrl: "$LOCAL_JOB_DISPATCH_URL:"
  dispatchKey: "$LOCAL_JOB_DISPATCH_KEY:"

resend:
  apiKey: "$RESEND_API_KEY:"

admin:
  userId: "$ADMIN_USER_ID:"

internal:
  key: "$INTERNAL_API_KEY:"

openrouter:
  apiKey: "$OPENROUTER_API_KEY:"
  baseUrl: "$OPENROUTER_BASE_URL:https://openrouter.ai"
  siteUrl: "$OPENROUTER_SITE_URL:"
  appName: "$OPENROUTER_APP_NAME:Kanji Masta"
  reasoningEffort: "$OPENROUTER_REASONING_EFFORT:medium"

jobs:
  leaseSeconds: "$JOB_LEASE_SECONDS:1500"
  quizBatchSize: "$QUIZ_JOB_BATCH_SIZE:10"
  maxImageBytes: "$PHOTO_MAX_IMAGE_BYTES:10485760"
