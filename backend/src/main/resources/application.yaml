ktor:
  deployment:
    port: "$PORT:8080"
  application:
    modules:
      - com.kanjimasta.ApplicationKt.module

database:
  url: "$DATABASE_URL:"

supabase:
  url: "$SUPABASE_URL:"
  serviceRoleKey: "$SUPABASE_SERVICE_ROLE_KEY:"

cors:
  allowedOrigins: "$CORS_ALLOWED_ORIGINS:"

aiWorker:
  baseUrl: "$AI_WORKER_URL:"

photoAnalysis:
  jobName: "$PHOTO_ANALYSIS_JOB:"

resend:
  apiKey: "$RESEND_API_KEY:"

admin:
  userId: "$ADMIN_USER_ID:"

internal:
  key: "$INTERNAL_API_KEY:"

self:
  url: "$SELF_URL:"

openrouter:
  apiKey: "$OPENROUTER_API_KEY:"
  baseUrl: "$OPENROUTER_BASE_URL:https://openrouter.ai"

claude:
  apiKey: "$CLAUDE_API_KEY:"

gemini:
  apiKey: "$GEMINI_API_KEY:"
