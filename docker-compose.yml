x-kotlin-runtime: &kotlin-runtime
  image: kanji-masta-kotlin:local
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-job-environment: &job-environment
  DATABASE_URL: postgresql://postgres:postgres@host.docker.internal:54322/postgres
  SUPABASE_URL: http://host.docker.internal:54321
  OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
  OPENROUTER_REASONING_EFFORT: ${OPENROUTER_REASONING_EFFORT:-medium}
  OPENROUTER_SITE_URL: ${OPENROUTER_SITE_URL:-https://shuukanhq.com}
  OPENROUTER_APP_NAME: ${OPENROUTER_APP_NAME:-Kanji Masta}
  PHOTO_MAX_IMAGE_BYTES: ${PHOTO_MAX_IMAGE_BYTES:-10485760}
  HIKARI_MAX_POOL_SIZE: ${HIKARI_MAX_POOL_SIZE:-5}

services:
  job-dispatcher:
    <<: *kotlin-runtime
    build: ./backend
    command: ["local-dispatcher"]
    environment:
      <<: *job-environment
      LOCAL_JOB_JAR: /app/app.jar
      LOCAL_JOB_DISPATCH_KEY: ${LOCAL_JOB_DISPATCH_KEY:-local-job-dispatch-key}
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 2s
      timeout: 1s
      retries: 15
      start_period: 2s

  backend:
    <<: *kotlin-runtime
    command: ["web"]
    ports:
      - "8080:8080"
    depends_on:
      job-dispatcher:
        condition: service_healthy
    environment:
      <<: *job-environment
      LOCAL_JOB_DISPATCH_URL: http://job-dispatcher:8081
      LOCAL_JOB_DISPATCH_KEY: ${LOCAL_JOB_DISPATCH_KEY:-local-job-dispatch-key}
      ADMIN_USER_ID: ${ADMIN_USER_ID:-}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-local-dev-key}

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080
        VITE_SUPABASE_URL: ${SUPABASE_URL:-http://localhost:54321}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${SUPABASE_PUBLISHABLE_KEY:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend
