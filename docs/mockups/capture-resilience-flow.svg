<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1960" viewBox="0 0 1800 1960" role="img" aria-labelledby="title desc">
  <title id="title">Kanji Masta capture resilience flow</title>
  <desc id="desc">Six dark mobile mockups showing upload safety, a server-owned processing scan, recovery from Home after locking the phone, a ready result, restored kanji selection, and a visible failed-analysis recovery state.</desc>
  <defs>
    <linearGradient id="slot-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#849B96"/>
      <stop offset="1" stop-color="#846F77"/>
    </linearGradient>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EBE9"/>
      <stop offset="1" stop-color="#C6B0B8"/>
    </linearGradient>
    <linearGradient id="photo-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243240"/>
      <stop offset="1" stop-color="#3B4251"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B303C" flood-opacity="0.42"/>
    </filter>
    <style>
      .canvas{fill:#8C94A8}.app{fill:#343A48}.card{fill:#454D5E}.raised{fill:#555E72}.line{stroke:rgba(245,245,245,.08);stroke-width:1}
      .text{fill:#F5F5F5;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.muted{fill:#DFE2E8;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.quiet{fill:#BCC2CD;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
      .primary{fill:#E4EBE9;font-family:"Noto Sans JP",system-ui,sans-serif}.primaryPale{fill:#EEF2F1;font-family:"Noto Sans JP",system-ui,sans-serif}.secondary{fill:#D8C8CE;font-family:"Noto Sans JP",system-ui,sans-serif}.secondaryPale{fill:#E7DCE0;font-family:"Noto Sans JP",system-ui,sans-serif}.warning{fill:#CA7288;font-family:"Noto Sans JP",system-ui,sans-serif}
      .darkText{fill:#30343F;font-family:"Noto Sans JP",system-ui,sans-serif}.title{font-size:28px;font-weight:800;letter-spacing:-.6px}.h1{font-size:26px;font-weight:800;letter-spacing:-.4px}.h2{font-size:19px;font-weight:750}.kanji{font-size:34px;font-weight:700}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:10px}.label{font-size:11px;font-weight:800;letter-spacing:1.2px}.button{font-size:15px;font-weight:800}
    </style>
    <g id="phone-shell">
      <rect width="390" height="760" rx="30" class="app" filter="url(#shadow)"/>
      <rect x="1" y="1" width="388" height="758" rx="29" fill="none" stroke="rgba(245,245,245,.09)"/>
    </g>
    <g id="back-control">
      <circle cx="40" cy="47" r="20" class="raised"/>
      <path d="m43 39-9 8 9 8M34 47h14" fill="none" stroke="#DFE2E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g id="station-photo">
      <rect x="26" y="104" width="338" height="202" rx="18" fill="url(#photo-gradient)" stroke="rgba(245,245,245,.10)"/>
      <rect x="26" y="236" width="338" height="70" rx="0" fill="#171d25"/>
      <path d="M26 236h338M60 306v-70m270 70v-70" stroke="#778196" stroke-width="4"/>
      <rect x="77" y="142" width="236" height="72" rx="4" fill="#F5F5F5"/>
      <rect x="77" y="142" width="10" height="72" fill="#D6E2DF"/>
      <text x="115" y="176" fill="#3B4251" font-family="Noto Sans JP,system-ui" font-size="25" font-weight="800">東京駅</text>
      <text x="116" y="198" fill="#A8AFBD" font-family="system-ui" font-size="10" font-weight="700" letter-spacing="1.2">TOKYO STATION</text>
      <circle cx="290" cy="178" r="8" fill="#C6B0B8"/>
      <circle cx="290" cy="178" r="3" fill="#F5F5F5"/>
      <path d="M46 127h20M46 127v20M344 127h-20M344 127v20M46 283h20M46 283v-20M344 283h-20M344 283v-20" fill="none" stroke="#EEF2F1" stroke-width="2" stroke-linecap="round"/>
    </g>
    <g id="home-header">
      <text x="26" y="61" class="text h1">Good evening</text>
      <text x="26" y="84" fill="#CA7288" font-family="system-ui" font-size="13" font-weight="700">You are on a 12 day streak</text>
      <rect x="302" y="34" width="62" height="30" rx="15" fill="rgba(202,114,136,.13)"/>
      <path d="M318 55c-7-7 2-12 0-19 8 5 11 11 7 18-2 4-5 5-7 1Z" fill="none" stroke="#D58D9F" stroke-width="1.8"/>
      <text x="341" y="55" text-anchor="middle" fill="#D58D9F" font-family="system-ui" font-size="13" font-weight="800">12</text>
    </g>
    <g id="capture-button">
      <rect x="26" y="682" width="338" height="58" rx="29" fill="#F5F5F5"/>
      <rect x="42" y="695" width="32" height="32" rx="16" fill="#F5F5F5"/>
      <path d="M51 704h14l3 4h4v12H48v-12h4l3-4Zm9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" fill="none" stroke="#454D5E" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="208" y="718" text-anchor="middle" fill="#454D5E" font-family="system-ui" font-size="15" font-weight="800">Capture Japanese</text>
    </g>
  </defs>

  <rect width="1800" height="1960" class="canvas"/>
  <rect x="60" y="32" width="38" height="38" rx="10" fill="url(#brand-gradient)"/>
  <path d="M72 58c10-2 15-8 16-17-9 1-15 6-16 17Zm0 0c-2-7-1-13 2-18" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
  <text x="112" y="55" class="text title">Capture resilience — leave safely, return confidently</text>
  <text x="112" y="80" class="muted body">Mobile storyboard aligned to the server-owned scan contract, stable routes, and the existing Kanji Masta dark theme.</text>
  <rect x="1538" y="36" width="202" height="30" rx="15" fill="rgba(214,226,223,.13)" stroke="rgba(228,235,233,.28)"/>
  <text x="1639" y="56" text-anchor="middle" class="primaryPale label">UX MOCKUP · AUG 2026</text>

  <!-- 01 ANALYSING -->
  <text x="60" y="128" class="secondaryPale label">01 · CAPTURE · ANALYSING</text>
  <use href="#phone-shell" x="60" y="150"/>
  <use href="#back-control" x="60" y="150"/>
  <text x="120" y="199" class="text h2">New scan</text>
  <use href="#station-photo" x="60" y="150"/>
  <rect x="86" y="490" width="338" height="240" rx="20" class="card" stroke="rgba(245,245,245,.09)"/>
  <circle cx="124" cy="533" r="18" fill="rgba(216,200,206,.12)"/>
  <path d="M124 522v22M113 533h22" stroke="#D8C8CE" stroke-width="1.8" stroke-linecap="round"/>
  <text x="156" y="527" class="text h2">Analysing</text>
  <text x="156" y="550" class="primaryPale small">You can close the app</text>
  <rect x="112" y="584" width="286" height="6" rx="3" class="raised"/>
  <rect x="168" y="584" width="112" height="6" rx="3" fill="#D8C8CE"/>
  <text x="112" y="624" class="muted small">We'll keep working in the background.</text>
  <rect x="112" y="659" width="286" height="44" rx="12" class="raised" stroke="rgba(245,245,245,.08)"/>
  <text x="255" y="687" text-anchor="middle" class="muted button">Back to Home</text>

  <!-- ARROW 1 -->
  <path d="M494 530h132" fill="none" stroke="#C6B0B8" stroke-width="2"/>
  <path d="m615 523 12 7-12 7" fill="none" stroke="#D8C8CE" stroke-width="2"/>
  <text x="560" y="495" text-anchor="middle" class="muted small">lock immediately</text>
  <text x="560" y="515" text-anchor="middle" class="secondaryPale small">reopen later</text>

  <!-- 02 LOCAL QUEUE RECOVERED -->
  <text x="705" y="128" class="secondaryPale label">02 · HOME · LOCAL CAPTURE QUEUED</text>
  <use href="#phone-shell" x="705" y="150"/>
  <use href="#home-header" x="705" y="150"/>
  <rect x="731" y="270" width="338" height="188" rx="20" fill="url(#slot-gradient)" stroke="rgba(245,245,245,.10)"/>
  <text x="757" y="308" class="primaryPale body" font-weight="750">Ready to quiz</text>
  <text x="757" y="364" class="text" font-family="system-ui" font-size="42" font-weight="850">5</text>
  <text x="793" y="364" class="text h2" opacity=".72">quizzes</text>
  <rect x="757" y="390" width="286" height="48" rx="12" fill="#D6E2DF"/>
  <text x="900" y="421" text-anchor="middle" class="darkText button">Start session</text>
  <text x="731" y="490" class="muted label">SAVED CAPTURE</text>
  <rect x="731" y="508" width="338" height="138" rx="18" fill="rgba(198,176,184,.10)" stroke="rgba(216,200,206,.34)"/>
  <rect x="749" y="526" width="76" height="102" rx="12" fill="url(#photo-gradient)"/>
  <rect x="762" y="556" width="50" height="24" rx="2" fill="#F5F5F5"/>
  <text x="787" y="573" text-anchor="middle" fill="#3B4251" font-family="Noto Sans JP,system-ui" font-size="11" font-weight="800">東京駅</text>
  <circle cx="849" cy="547" r="5" fill="#D8C8CE"/>
  <text x="865" y="552" class="text body" font-weight="800">Waiting to upload</text>
  <text x="849" y="580" class="primaryPale small">Saved on this device</text>
  <text x="849" y="604" class="muted tiny">Resumes when connection is available</text>
  <path d="m1039 562 8 8-8 8" fill="none" stroke="#D8C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#capture-button" x="705" y="150"/>

  <!-- ARROW 2 -->
  <path d="M1139 530h132" fill="none" stroke="#C6B0B8" stroke-width="2"/>
  <path d="m1260 523 12 7-12 7" fill="none" stroke="#D8C8CE" stroke-width="2"/>
  <text x="1205" y="495" text-anchor="middle" class="muted small">connection returns</text>
  <text x="1205" y="515" text-anchor="middle" class="secondaryPale small">upload accepted</text>

  <!-- 03 HOME ACTIVE -->
  <text x="1350" y="128" class="secondaryPale label">03 · HOME · ACTIVE SCAN</text>
  <use href="#phone-shell" x="1350" y="150"/>
  <use href="#home-header" x="1350" y="150"/>
  <rect x="1376" y="270" width="338" height="188" rx="20" fill="url(#slot-gradient)" stroke="rgba(245,245,245,.10)"/>
  <text x="1402" y="308" class="primaryPale body" font-weight="750">Ready to quiz</text>
  <text x="1402" y="364" class="text" font-family="system-ui" font-size="42" font-weight="850">5</text>
  <text x="1438" y="364" class="text h2" opacity=".72">quizzes</text>
  <rect x="1402" y="390" width="286" height="48" rx="12" fill="#D6E2DF"/>
  <text x="1545" y="421" text-anchor="middle" class="darkText button">Start session</text>
  <text x="1376" y="490" class="muted label">ACTIVE SCAN</text>
  <rect x="1376" y="508" width="338" height="126" rx="18" fill="rgba(198,176,184,.10)" stroke="rgba(216,200,206,.34)"/>
  <rect x="1394" y="526" width="76" height="90" rx="12" fill="url(#photo-gradient)"/>
  <rect x="1407" y="552" width="50" height="24" rx="2" fill="#F5F5F5"/>
  <text x="1432" y="569" text-anchor="middle" fill="#3B4251" font-family="Noto Sans JP,system-ui" font-size="11" font-weight="800">東京駅</text>
  <circle cx="1494" cy="547" r="5" fill="#D8C8CE"/>
  <text x="1510" y="552" class="text body" font-weight="800">Analysing your photo</text>
  <text x="1494" y="580" class="primaryPale small">Safe to close the app</text>
  <text x="1494" y="604" class="muted tiny">Started just now</text>
  <path d="m1684 562 8 8-8 8" fill="none" stroke="#D8C8CE" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <use href="#capture-button" x="1350" y="150"/>

  <!-- ROW TRANSITION -->
  <path d="M1545 940v52H255v45" fill="none" stroke="#C6B0B8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="m248 1025 7 12 7-12" fill="none" stroke="#D8C8CE" stroke-width="2"/>
  <text x="900" y="977" text-anchor="middle" class="muted small">Phone locks, the server completes analysis, and a fresh Home fetch restores the same actionable scan.</text>

  <!-- 04 HOME READY -->
  <text x="60" y="1048" class="secondaryPale label">04 · HOME · SCAN READY</text>
  <use href="#phone-shell" x="60" y="1070"/>
  <use href="#home-header" x="60" y="1070"/>
  <rect x="86" y="1190" width="338" height="188" rx="20" fill="url(#slot-gradient)" stroke="rgba(245,245,245,.10)"/>
  <text x="112" y="1228" class="primaryPale body" font-weight="750">Ready to quiz</text>
  <text x="112" y="1284" class="text" font-family="system-ui" font-size="42" font-weight="850">5</text>
  <text x="148" y="1284" class="text h2" opacity=".72">quizzes</text>
  <rect x="112" y="1310" width="286" height="48" rx="12" fill="#D6E2DF"/>
  <text x="255" y="1341" text-anchor="middle" class="darkText button">Start session</text>
  <text x="86" y="1410" class="muted label">READY TO REVIEW</text>
  <rect x="86" y="1428" width="338" height="138" rx="18" fill="rgba(214,226,223,.09)" stroke="rgba(228,235,233,.34)"/>
  <rect x="104" y="1446" width="76" height="102" rx="12" fill="url(#photo-gradient)"/>
  <rect x="117" y="1476" width="50" height="24" rx="2" fill="#F5F5F5"/>
  <text x="142" y="1493" text-anchor="middle" fill="#3B4251" font-family="Noto Sans JP,system-ui" font-size="11" font-weight="800">東京駅</text>
  <circle cx="204" cy="1467" r="12" fill="rgba(228,235,233,.14)"/>
  <path d="m198 1467 4 4 8-10" fill="none" stroke="#E4EBE9" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="224" y="1473" class="text body" font-weight="800">Scan ready</text>
  <text x="204" y="1503" class="primaryPale small" font-weight="750">5 kanji found</text>
  <text x="204" y="1530" class="muted tiny">Tap to review results</text>
  <path d="m394 1486 8 8-8 8" fill="none" stroke="#E4EBE9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="86" y="1598" width="338" height="92" rx="16" class="card" stroke="rgba(245,245,245,.08)"/>
  <text x="106" y="1630" class="secondaryPale label">RECENT SCANS</text>
  <text x="106" y="1662" class="muted small">The ready scan remains in history until reviewed.</text>
  <use href="#capture-button" x="60" y="1070"/>

  <!-- ARROW 4 -->
  <path d="M494 1450h132" fill="none" stroke="#C6B0B8" stroke-width="2"/>
  <path d="m615 1443 12 7-12 7" fill="none" stroke="#D8C8CE" stroke-width="2"/>
  <text x="560" y="1430" text-anchor="middle" class="muted small">tap Scan ready</text>

  <!-- 05 RESTORED RESULTS -->
  <text x="705" y="1048" class="secondaryPale label">05 · SCAN DETAIL · RESTORED RESULTS</text>
  <use href="#phone-shell" x="705" y="1070"/>
  <use href="#back-control" x="705" y="1070"/>
  <text x="765" y="1111" class="text h2">Found Kanji</text>
  <text x="765" y="1133" class="muted small">5 detected · restored from /scans/8f2…</text>
  <rect x="731" y="1172" width="338" height="92" rx="16" fill="rgba(214,226,223,.07)" stroke="rgba(228,235,233,.22)"/>
  <rect x="747" y="1188" width="66" height="60" rx="10" fill="url(#photo-gradient)"/>
  <rect x="757" y="1204" width="46" height="22" rx="2" fill="#F5F5F5"/>
  <text x="780" y="1220" text-anchor="middle" fill="#3B4251" font-family="Noto Sans JP,system-ui" font-size="10" font-weight="800">東京駅</text>
  <text x="831" y="1206" class="primaryPale small" font-weight="750">Analysis complete</text>
  <text x="831" y="1231" class="muted tiny">Review what you already know and want to learn.</text>
  <rect x="731" y="1284" width="338" height="150" rx="18" class="card" stroke="rgba(245,245,245,.09)"/>
  <text x="751" y="1334" class="text kanji">駅</text>
  <text x="801" y="1317" class="secondaryPale small">えき</text>
  <text x="801" y="1341" class="muted body">station</text>
  <rect x="751" y="1370" width="126" height="42" rx="12" fill="rgba(198,176,184,.18)" stroke="rgba(216,200,206,.38)"/>
  <text x="814" y="1397" text-anchor="middle" class="secondaryPale small" font-weight="800">Want to learn</text>
  <rect x="889" y="1370" width="156" height="42" rx="12" class="raised"/>
  <text x="967" y="1397" text-anchor="middle" class="muted small" font-weight="700">Already familiar</text>
  <rect x="731" y="1450" width="338" height="150" rx="18" class="card" stroke="rgba(245,245,245,.09)"/>
  <text x="751" y="1500" class="text kanji">東</text>
  <text x="801" y="1483" class="secondaryPale small">ひがし</text>
  <text x="801" y="1507" class="muted body">east</text>
  <rect x="751" y="1536" width="126" height="42" rx="12" class="raised"/>
  <text x="814" y="1563" text-anchor="middle" class="muted small" font-weight="700">Want to learn</text>
  <rect x="889" y="1536" width="156" height="42" rx="12" fill="rgba(214,226,223,.12)" stroke="rgba(228,235,233,.34)"/>
  <text x="967" y="1563" text-anchor="middle" class="primaryPale small" font-weight="800">Already familiar</text>
  <text x="731" y="1632" class="quiet small">3 more kanji below</text>
  <rect x="731" y="1742" width="338" height="52" rx="12" fill="#D6E2DF"/>
  <text x="900" y="1775" text-anchor="middle" class="darkText button">Save selections</text>

  <!-- 06 FAILED ALTERNATE -->
  <text x="1350" y="1048" class="secondaryPale label">06 · SCAN DETAIL · FAILED ALTERNATE</text>
  <use href="#phone-shell" x="1350" y="1070"/>
  <use href="#back-control" x="1350" y="1070"/>
  <text x="1410" y="1111" class="text h2">Scan needs attention</text>
  <text x="1410" y="1133" class="muted small">The scan stays visible until you act</text>
  <g transform="translate(1350 1070) scale(1 .72)"><use href="#station-photo"/></g>
  <rect x="1376" y="1324" width="338" height="334" rx="20" fill="rgba(116,68,81,.12)" stroke="rgba(202,114,136,.30)"/>
  <circle cx="1545" cy="1392" r="32" fill="rgba(202,114,136,.12)"/>
  <path d="M1545 1376v21m0 11v1" stroke="#CA7288" stroke-width="3" stroke-linecap="round"/>
  <text x="1545" y="1460" text-anchor="middle" class="text h1">Analysis did not finish</text>
  <text x="1545" y="1494" text-anchor="middle" class="muted small">Your scan is still listed on Home.</text>
  <text x="1545" y="1517" text-anchor="middle" class="muted small">Choose another photo to continue.</text>
  <rect x="1402" y="1550" width="286" height="52" rx="12" fill="#D6E2DF"/>
  <text x="1545" y="1583" text-anchor="middle" class="darkText button">Capture another photo</text>
  <rect x="1402" y="1614" width="286" height="40" rx="12" fill="rgba(245,245,245,.04)"/>
  <text x="1545" y="1640" text-anchor="middle" class="muted button">Back to Home</text>
  <rect x="1376" y="1690" width="338" height="88" rx="14" class="card" stroke="rgba(245,245,245,.08)"/>
  <circle cx="1404" cy="1719" r="12" fill="rgba(216,200,206,.12)"/>
  <path d="M1404 1712v1m0 5v8" stroke="#D8C8CE" stroke-width="1.7" stroke-linecap="round"/>
  <text x="1426" y="1722" class="secondaryPale small" font-weight="750">No silent disappearance</text>
  <text x="1402" y="1752" class="muted tiny">Failure uses icon, text, and an explicit recovery action.</text>

  <text x="60" y="1905" class="muted body">Contract notes: the IndexedDB commit makes the photo safe to leave; the server recent-sessions endpoint restores accepted work; stable scan URLs survive reload.</text>
</svg>
