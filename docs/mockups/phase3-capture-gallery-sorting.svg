<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040" role="img" aria-labelledby="title desc">
  <title id="title">Kanji Masta Phase 3 capture gallery sorting</title>
  <desc id="desc">Three dark mobile mockups showing the default order and reversible direction contract for Recent, Familiarity, and Recently visited gallery tabs.</desc>
  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4EBE9"/><stop offset="1" stop-color="#C6B0B8"/></linearGradient>
    <linearGradient id="station-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#334155"/><stop offset="1" stop-color="#3B4251"/></linearGradient>
    <linearGradient id="grocery-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3f3f46"/><stop offset="1" stop-color="#454D5E"/></linearGradient>
    <linearGradient id="museum-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#846F77"/><stop offset="1" stop-color="#17142f"/></linearGradient>
    <linearGradient id="menu-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#748B86"/><stop offset="1" stop-color="#10201b"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B303C" flood-opacity="0.48"/></filter>
    <style>
      .canvas{fill:#8C94A8}.app{fill:#343A48}.card{fill:#454D5E}.raised{fill:#555E72}
      .text{fill:#F5F5F5;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.muted{fill:#DFE2E8;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.quiet{fill:#BCC2CD;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
      .primary{fill:#E4EBE9;font-family:"Noto Sans JP",system-ui,sans-serif}.secondary{fill:#D8C8CE;font-family:"Noto Sans JP",system-ui,sans-serif}.secondaryPale{fill:#E7DCE0;font-family:"Noto Sans JP",system-ui,sans-serif}.darkText{fill:#30343F;font-family:"Noto Sans JP",system-ui,sans-serif}
      .title{font-size:28px;font-weight:800;letter-spacing:-.6px}.h1{font-size:24px;font-weight:800}.h2{font-size:17px;font-weight:750}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:10px}.micro{font-size:9px}.label{font-size:11px;font-weight:800;letter-spacing:1.15px}.tab{font-size:11px;font-weight:750}.metric{font-size:20px;font-weight:850}
    </style>
    <g id="phone-shell"><rect width="390" height="760" rx="30" class="app" filter="url(#shadow)"/><rect x="1" y="1" width="388" height="758" rx="29" fill="none" stroke="rgba(245,245,245,.09)"/></g>
    <g id="gallery-header">
      <circle cx="40" cy="47" r="20" class="raised"/><path d="m43 39-9 8 9 8M34 47h14" fill="none" stroke="#DFE2E8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="72" y="43" class="text h1">Captures</text><text x="72" y="65" class="muted tiny">4 saved photos</text>
    </g>
    <g id="tabs-base">
      <rect x="26" y="86" width="338" height="52" rx="14" class="raised"/>
      <text x="74" y="117" text-anchor="middle" class="muted tab">Recent</text>
      <text x="181" y="117" text-anchor="middle" class="muted tab">Familiarity</text>
      <text x="297" y="117" text-anchor="middle" class="muted tab">Recently visited</text>
    </g>
    <g id="card-station">
      <rect width="162" height="208" rx="17" class="card" stroke="rgba(245,245,245,.08)"/>
      <rect x="8" y="8" width="146" height="92" rx="12" fill="url(#station-gradient)"/><rect x="26" y="35" width="110" height="38" rx="3" fill="#F5F5F5"/><rect x="26" y="35" width="5" height="38" fill="#D6E2DF"/><text x="38" y="52" fill="#3B4251" font-family="Noto Sans JP,system-ui" font-size="8" font-weight="800">運転見合わせ</text><text x="38" y="64" fill="#A8AFBD" font-family="system-ui" font-size="5">SERVICE NOTICE</text>
      <text x="14" y="124" class="text small" font-weight="750">本日は運転を…</text><text x="14" y="144" class="quiet tiny">Aug 6 · Today</text>
      <rect x="14" y="158" width="134" height="5" rx="2.5" class="raised"/><rect x="14" y="158" width="82" height="5" rx="2.5" fill="#D6E2DF"/>
      <text x="14" y="184" class="primary tiny" font-weight="750">61% familiar</text><text x="148" y="184" text-anchor="end" class="quiet tiny">18 kanji</text>
      <text x="14" y="199" class="secondary micro">Visited today</text>
    </g>
    <g id="card-grocery">
      <rect width="162" height="208" rx="17" class="card" stroke="rgba(245,245,245,.08)"/>
      <rect x="8" y="8" width="146" height="92" rx="12" fill="url(#grocery-gradient)"/><circle cx="49" cy="48" r="22" fill="#b91c1c"/><text x="49" y="53" text-anchor="middle" fill="#F5F5F5" font-family="Noto Sans JP,system-ui" font-size="14" font-weight="900">特売</text><rect x="84" y="28" width="52" height="48" rx="4" fill="#F5F5F5"/><text x="110" y="49" text-anchor="middle" fill="#454D5E" font-family="Noto Sans JP,system-ui" font-size="9" font-weight="800">野菜</text><text x="110" y="65" text-anchor="middle" fill="#dc2626" font-family="system-ui" font-size="11" font-weight="900">98円</text>
      <text x="14" y="124" class="text small" font-weight="750">野菜 特売 98円</text><text x="14" y="144" class="quiet tiny">Aug 1 · 5 days ago</text>
      <rect x="14" y="158" width="134" height="5" rx="2.5" class="raised"/><rect x="14" y="158" width="134" height="5" rx="2.5" fill="#D6E2DF"/>
      <text x="14" y="184" class="primary tiny" font-weight="750">100% familiar</text><text x="148" y="184" text-anchor="end" class="quiet tiny">13 kanji</text>
      <text x="14" y="199" class="secondary micro">Visited 2 weeks ago</text>
    </g>
    <g id="card-museum">
      <rect width="162" height="208" rx="17" class="card" stroke="rgba(245,245,245,.08)"/>
      <rect x="8" y="8" width="146" height="92" rx="12" fill="url(#museum-gradient)"/><circle cx="122" cy="36" r="28" fill="rgba(198,176,184,.18)"/><path d="m33 78 31-48 25 48z" fill="none" stroke="#C6B0B8" stroke-width="2"/><text x="98" y="62" fill="#E7DCE0" font-family="Noto Sans JP,system-ui" font-size="11" font-weight="800">特別展</text><text x="98" y="78" fill="#E7DCE0" font-family="system-ui" font-size="6">SPECIAL EXHIBITION</text>
      <text x="14" y="124" class="text small" font-weight="750">特別展</text><text x="14" y="144" class="quiet tiny">Jul 20 · 17 days ago</text>
      <rect x="14" y="158" width="134" height="5" rx="2.5" class="raised"/><rect x="14" y="158" width="29" height="5" rx="2.5" fill="#D6E2DF"/>
      <text x="14" y="184" class="primary tiny" font-weight="750">22% familiar</text><text x="148" y="184" text-anchor="end" class="quiet tiny">27 kanji</text>
      <text x="14" y="199" class="quiet micro">Never visited</text>
    </g>
    <g id="card-menu">
      <rect width="162" height="208" rx="17" class="card" stroke="rgba(245,245,245,.08)"/>
      <rect x="8" y="8" width="146" height="92" rx="12" fill="url(#menu-gradient)"/><rect x="26" y="22" width="110" height="64" rx="4" fill="#102a22" stroke="#EEF2F1"/><text x="81" y="48" text-anchor="middle" fill="#EEF2F1" font-family="Noto Sans JP,system-ui" font-size="11" font-weight="800">本日の定食</text><text x="81" y="69" text-anchor="middle" fill="#EEF2F1" font-family="system-ui" font-size="9">1,200円</text>
      <text x="14" y="124" class="text small" font-weight="750">本日の定食</text><text x="14" y="144" class="quiet tiny">Jun 3 · 2 months ago</text>
      <rect x="14" y="158" width="134" height="5" rx="2.5" class="raised"/>
      <text x="14" y="184" class="muted tiny" font-weight="750">Coverage N/A</text><text x="148" y="184" text-anchor="end" class="secondary tiny">Processing</text>
      <text x="14" y="199" class="secondary micro">Visited yesterday</text>
    </g>
    <g id="screen-footer"><text x="26" y="674" class="quiet tiny">Tap the active tab again to reverse</text><text x="364" y="674" text-anchor="end" class="secondary tiny">Same tab, opposite order</text><rect x="151" y="720" width="88" height="5" rx="2.5" fill="#27272a"/></g>
  </defs>

  <rect width="1800" height="1040" class="canvas"/>
  <rect x="60" y="32" width="38" height="38" rx="10" fill="url(#brand-gradient)"/><path d="M72 58c10-2 15-8 16-17-9 1-15 6-16 17Zm0 0c-2-7-1-13 2-18" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
  <text x="112" y="55" class="text title">Phase 3.2 — capture gallery sorting</text>
  <text x="112" y="80" class="muted body">One standard gallery page. Each active tab reverses in place when tapped again.</text>
  <rect x="1468" y="36" width="272" height="30" rx="15" fill="rgba(216,200,206,.12)" stroke="rgba(216,200,206,.28)"/><text x="1604" y="56" text-anchor="middle" class="secondaryPale label">SORT CONTRACT STORYBOARD</text>

  <!-- RECENT DESCENDING -->
  <text x="60" y="128" class="secondaryPale label">01 · RECENT · DEFAULT NEWEST</text>
  <g transform="translate(60 150)">
    <use href="#phone-shell"/><use href="#gallery-header"/><use href="#tabs-base"/>
    <rect x="34" y="92" width="80" height="40" rx="11" fill="#C6B0B8"/><text x="74" y="117" text-anchor="middle" class="text tab">Recent ↓</text>
    <text x="26" y="164" class="muted small">Newest first</text><text x="364" y="164" text-anchor="end" class="secondary tiny">Reverse: oldest ↑</text>
    <use href="#card-station" x="26" y="182"/><use href="#card-grocery" x="202" y="182"/><use href="#card-museum" x="26" y="404"/><use href="#card-menu" x="202" y="404"/><use href="#screen-footer"/>
  </g>
  <!-- FAMILIARITY -->
  <text x="705" y="128" class="secondaryPale label">02 · FAMILIARITY · DEFAULT HIGHEST</text>
  <g transform="translate(705 150)">
    <use href="#phone-shell"/><use href="#gallery-header"/><use href="#tabs-base"/>
    <rect x="126" y="92" width="110" height="40" rx="11" fill="#C6B0B8"/><text x="181" y="117" text-anchor="middle" class="text tab">Familiarity ↓</text>
    <text x="26" y="164" class="muted small">Highest first</text><text x="364" y="164" text-anchor="end" class="quiet tiny">Reverse: lowest ↑ · N/A last</text>
    <use href="#card-grocery" x="26" y="182"/><use href="#card-station" x="202" y="182"/><use href="#card-museum" x="26" y="404"/><use href="#card-menu" x="202" y="404"/><use href="#screen-footer"/>
  </g>

  <!-- RECENTLY VISITED -->
  <text x="1350" y="128" class="secondaryPale label">03 · RECENTLY VISITED · DEFAULT LATEST</text>
  <g transform="translate(1350 150)">
    <use href="#phone-shell"/><use href="#gallery-header"/><use href="#tabs-base"/>
    <rect x="242" y="92" width="114" height="40" rx="11" fill="#C6B0B8"/><text x="299" y="113" text-anchor="middle" class="text tiny" font-weight="750">Recently visited ↓</text>
    <text x="26" y="164" class="muted small">Last opened first</text><text x="364" y="164" text-anchor="end" class="quiet tiny">Reverse: never visited ↑</text>
    <use href="#card-station" x="26" y="182"/><use href="#card-menu" x="202" y="182"/><use href="#card-grocery" x="26" y="404"/><use href="#card-museum" x="202" y="404"/><use href="#screen-footer"/>
  </g>
</svg>
