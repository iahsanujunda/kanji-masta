<svg xmlns="http://www.w3.org/2000/svg" width="2340" height="1960" viewBox="0 0 2340 1960" role="img" aria-labelledby="title desc">
  <title id="title">Kanji Masta Phase 3 session state variants</title>
  <desc id="desc">Eight dark mobile mockups covering active-session resume, cooldown, re-introduction, normal incorrect feedback, revisit-later feedback, layout-matched loading, inline save retry, and explicit session exit confirmation.</desc>
  <defs>
    <linearGradient id="slot-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#849B96"/><stop offset="1" stop-color="#846F77"/></linearGradient>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4EBE9"/><stop offset="1" stop-color="#C6B0B8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B303C" flood-opacity="0.42"/></filter>
    <style>
      .canvas{fill:#8C94A8}.app{fill:#343A48}.card{fill:#454D5E}.raised{fill:#555E72}.line{stroke:rgba(245,245,245,.08);stroke-width:1}
      .text{fill:#F5F5F5;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.muted{fill:#DFE2E8;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.quiet{fill:#BCC2CD;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
      .primary{fill:#E4EBE9;font-family:"Noto Sans JP",system-ui,sans-serif}.primaryPale{fill:#EEF2F1;font-family:"Noto Sans JP",system-ui,sans-serif}.secondary{fill:#D8C8CE;font-family:"Noto Sans JP",system-ui,sans-serif}.secondaryPale{fill:#E7DCE0;font-family:"Noto Sans JP",system-ui,sans-serif}.purple{fill:#C6B0B8;font-family:"Noto Sans JP",system-ui,sans-serif}.warning{fill:#CA7288;font-family:"Noto Sans JP",system-ui,sans-serif}
      .darkText{fill:#30343F;font-family:"Noto Sans JP",system-ui,sans-serif}.title{font-size:28px;font-weight:800;letter-spacing:-.6px}.h1{font-size:26px;font-weight:800;letter-spacing:-.4px}.h2{font-size:19px;font-weight:750}.word{font-size:64px;font-weight:650}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:10px}.label{font-size:11px;font-weight:800;letter-spacing:1.2px}.button{font-size:15px;font-weight:800}
    </style>
    <g id="phone-shell"><rect width="390" height="760" rx="30" class="app" filter="url(#shadow)"/><rect x="1" y="1" width="388" height="758" rx="29" fill="none" stroke="rgba(245,245,245,.09)"/></g>
    <g id="quiz-header">
      <circle cx="40" cy="46" r="20" class="raised"/><path d="m33 39 14 14m0-14-14 14" stroke="#DFE2E8" stroke-width="2" stroke-linecap="round"/>
      <rect x="26" y="76" width="338" height="6" rx="3" class="raised"/>
    </g>
    <g id="quiz-options">
      <rect x="26" y="424" width="338" height="50" rx="12" class="raised" stroke="rgba(245,245,245,.08)"/><text x="195" y="455" text-anchor="middle" class="text button">train</text>
      <rect x="26" y="486" width="338" height="50" rx="12" class="raised" stroke="rgba(245,245,245,.08)"/><text x="195" y="517" text-anchor="middle" class="text button">phone</text>
      <rect x="26" y="548" width="338" height="50" rx="12" class="raised" stroke="rgba(245,245,245,.08)"/><text x="195" y="579" text-anchor="middle" class="text button">battery</text>
      <rect x="26" y="610" width="338" height="50" rx="12" class="raised" stroke="rgba(245,245,245,.08)"/><text x="195" y="641" text-anchor="middle" class="text button">subway</text>
    </g>
  </defs>

  <rect width="2340" height="1960" class="canvas"/>
  <rect x="40" y="32" width="38" height="38" rx="10" fill="url(#brand-gradient)"/><path d="M52 58c10-2 15-8 16-17-9 1-15 6-16 17Zm0 0c-2-7-1-13 2-18" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
  <text x="92" y="55" class="text title">Phase 3 — supporting session states</text>
  <text x="92" y="80" class="muted body">Contract and recovery variants for the same mobile components; these states share the primary storyboard's tokens and spacing.</text>
  <rect x="2100" y="36" width="200" height="30" rx="15" fill="rgba(216,200,206,.12)" stroke="rgba(216,200,206,.28)"/><text x="2200" y="56" text-anchor="middle" class="secondaryPale label">STATE REFERENCE</text>

  <!-- 01 ACTIVE RESUME -->
  <text x="40" y="128" class="secondaryPale label">01 · HOME · ACTIVE SESSION</text>
  <use href="#phone-shell" x="40" y="150"/>
  <text x="66" y="211" class="text h1">Good evening</text><text x="66" y="234" fill="#CA7288" font-family="system-ui" font-size="14" font-weight="700">You are on a 12 day streak</text>
  <rect x="66" y="270" width="338" height="254" rx="22" fill="url(#slot-gradient)" stroke="rgba(245,245,245,.11)"/>
  <text x="92" y="313" class="primaryPale body" font-weight="750">Session active</text><rect x="323" y="293" width="61" height="28" rx="14" fill="rgba(43,48,60,.24)"/><text x="353" y="312" text-anchor="middle" class="text tiny">3h 42m</text>
  <text x="92" y="369" class="text" font-family="system-ui" font-size="46" font-weight="850">3</text><text x="128" y="369" class="text h2" opacity=".72">reviews left</text>
  <rect x="92" y="410" width="286" height="70" rx="14" fill="#D6E2DF"/><text x="235" y="452" text-anchor="middle" class="darkText button">Continue session</text>
  <rect x="66" y="550" width="338" height="120" rx="18" class="card" stroke="rgba(245,245,245,.08)"/><text x="90" y="584" class="secondaryPale label">RESUME BEHAVIOR</text><text x="90" y="614" class="text body">Open the server's current card.</text><text x="90" y="640" class="muted small">Never rebuild the queue in the browser.</text>

  <!-- 02 COOLDOWN -->
  <text x="620" y="128" class="secondaryPale label">02 · HOME · COOLDOWN</text>
  <use href="#phone-shell" x="620" y="150"/>
  <text x="646" y="211" class="text h1">Good evening</text><text x="646" y="234" fill="#CA7288" font-family="system-ui" font-size="14" font-weight="700">You are on a 12 day streak</text>
  <rect x="646" y="270" width="338" height="254" rx="22" fill="url(#slot-gradient)" stroke="rgba(245,245,245,.11)"/>
  <text x="672" y="313" class="primaryPale body" font-weight="750">Session complete</text><circle cx="948" cy="306" r="17" fill="rgba(228,235,233,.12)"/><path d="m940 306 6 6 11-14" fill="none" stroke="#E4EBE9" stroke-width="2"/>
  <text x="672" y="369" class="text" font-family="system-ui" font-size="36" font-weight="850">2h 14m</text><text x="672" y="398" class="primaryPale small" opacity=".82">until the next session</text>
  <rect x="672" y="430" width="286" height="58" rx="14" fill="rgba(245,245,245,.10)" stroke="rgba(245,245,245,.12)"/><text x="815" y="466" text-anchor="middle" class="text button">Available at 22:15</text>
  <rect x="646" y="550" width="338" height="120" rx="18" class="card" stroke="rgba(245,245,245,.08)"/><text x="670" y="584" class="secondaryPale label">AUTHORITATIVE TIME</text><text x="670" y="614" class="text body">Derived from slotEndsAt.</text><text x="670" y="640" class="muted small">The client formats; it does not decide.</text>

  <!-- 03 REINTRODUCTION -->
  <text x="1200" y="128" class="secondaryPale label">03 · INTRODUCTION · REVISIT</text>
  <use href="#phone-shell" x="1200" y="150"/>
  <use href="#quiz-header" x="1200" y="150"/>
  <text x="1395" y="188" text-anchor="middle" class="purple label">LET'S REVISIT</text><text x="1395" y="208" text-anchor="middle" class="muted small">5 reviews left</text>
  <rect x="1342" y="255" width="106" height="28" rx="14" fill="rgba(198,176,184,.12)" stroke="rgba(198,176,184,.28)"/><path d="M1363 272a9 9 0 1 1 4 6m-4 0v-7h7" fill="none" stroke="#C6B0B8" stroke-width="1.5"/><text x="1410" y="274" text-anchor="middle" class="purple tiny" font-weight="750">FOCUS WORD</text>
  <text x="1395" y="365" text-anchor="middle" class="text word">電車</text><text x="1395" y="396" text-anchor="middle" class="secondaryPale body" letter-spacing="2">でんしゃ</text><text x="1395" y="428" text-anchor="middle" class="text h2">train</text>
  <text x="1226" y="472" class="muted label">MEMORY HOOK</text><rect x="1226" y="488" width="338" height="82" rx="14" class="raised" stroke="rgba(245,245,245,.08)"/><line x1="1395" y1="488" x2="1395" y2="570" class="line"/>
  <text x="1246" y="526" class="secondaryPale h1">電</text><text x="1279" y="526" class="muted small">electricity</text><text x="1415" y="526" class="primaryPale h1">車</text><text x="1448" y="526" class="muted small">vehicle</text>
  <rect x="1226" y="836" width="338" height="52" rx="12" fill="#D6E2DF"/><text x="1395" y="869" text-anchor="middle" class="darkText button">Got it</text>
  <text x="1226" y="718" class="muted small">No failure count. No punitive language.</text><text x="1226" y="741" class="muted small">Acknowledgement resets consecutive failures.</text>

  <!-- 04 NORMAL INCORRECT -->
  <text x="1780" y="128" class="secondaryPale label">04 · NORMAL REVIEW · INCORRECT</text>
  <use href="#phone-shell" x="1780" y="150"/>
  <use href="#quiz-header" x="1780" y="150"/>
  <text x="1975" y="188" text-anchor="middle" class="secondaryPale label">REVIEW · TIER 1</text><text x="1975" y="208" text-anchor="middle" class="muted small">2 reviews left</text><rect x="1806" y="226" width="203" height="6" rx="3" fill="#D8C8CE"/>
  <text x="1975" y="286" text-anchor="middle" class="muted label">CHOOSE THE READING</text><text x="1975" y="402" text-anchor="middle" class="text word">電話</text>
  <rect x="1806" y="458" width="338" height="48" rx="12" fill="rgba(214,226,223,.10)" stroke="rgba(214,226,223,.55)"/><text x="1975" y="488" text-anchor="middle" class="primaryPale button">でんわ</text>
  <rect x="1806" y="518" width="338" height="48" rx="12" fill="rgba(202,114,136,.08)" stroke="rgba(202,114,136,.45)"/><text x="1975" y="548" text-anchor="middle" class="warning button">でんき</text>
  <rect x="1780" y="634" width="390" height="276" rx="24" fill="#604653" stroke="rgba(202,114,136,.40)"/>
  <circle cx="1828" cy="682" r="18" fill="rgba(202,114,136,.12)"/><path d="m1819 673 18 18m0-18-18 18" stroke="#CA7288" stroke-width="2" stroke-linecap="round"/>
  <text x="1859" y="689" class="text h2">Not quite</text><text x="1806" y="737" class="muted body">電話 is read でんわ.</text><text x="1806" y="762" class="muted small">This normal review stays at its current tier.</text>
  <rect x="1806" y="814" width="338" height="52" rx="12" class="raised" stroke="rgba(245,245,245,.12)"/><text x="1975" y="847" text-anchor="middle" class="text button">Continue</text>

  <!-- 05 REVISIT LATER -->
  <text x="40" y="1048" class="secondaryPale label">05 · LEARNING STEP 2 · REVISIT LATER</text>
  <use href="#phone-shell" x="40" y="1070"/>
  <use href="#quiz-header" x="40" y="1070"/>
  <text x="235" y="1108" text-anchor="middle" class="secondaryPale label">QUICK RECALL · STEP 2</text><text x="235" y="1128" text-anchor="middle" class="muted small">0 reviews left</text><rect x="66" y="1146" width="338" height="6" rx="3" fill="#D8C8CE"/>
  <text x="235" y="1240" text-anchor="middle" class="text word">電車</text><text x="235" y="1270" text-anchor="middle" class="muted body" letter-spacing="2">でんしゃ</text>
  <rect x="66" y="1304" width="338" height="48" rx="12" fill="rgba(214,226,223,.10)" stroke="rgba(214,226,223,.55)"/><text x="235" y="1334" text-anchor="middle" class="primaryPale button">train</text>
  <rect x="66" y="1364" width="338" height="48" rx="12" fill="rgba(216,200,206,.08)" stroke="rgba(216,200,206,.45)"/><text x="235" y="1394" text-anchor="middle" class="secondaryPale button">phone</text>
  <rect x="40" y="1462" width="390" height="368" rx="24" class="raised" stroke="rgba(216,200,206,.35)"/>
  <circle cx="88" cy="1510" r="18" fill="rgba(216,200,206,.12)"/><circle cx="88" cy="1510" r="8" fill="none" stroke="#D8C8CE" stroke-width="1.7"/><path d="M88 1505v6l4 3" stroke="#D8C8CE" stroke-width="1.7" fill="none"/>
  <text x="119" y="1517" class="text h2">We'll revisit this</text><text x="66" y="1565" class="muted body">No penalty. 電車 will return in a future</text><text x="66" y="1588" class="muted body">session and familiarity remains at zero.</text>
  <rect x="66" y="1644" width="338" height="52" rx="12" fill="rgba(216,200,206,.12)" stroke="rgba(216,200,206,.24)"/><text x="235" y="1677" text-anchor="middle" class="secondaryPale button">Continue</text>

  <!-- 06 LOADING -->
  <text x="620" y="1048" class="secondaryPale label">06 · SESSION · LOADING</text>
  <use href="#phone-shell" x="620" y="1070"/>
  <circle cx="660" cy="1116" r="20" class="raised"/><rect x="785" y="1097" width="90" height="12" rx="6" class="raised"/><rect x="798" y="1118" width="64" height="9" rx="4.5" class="card"/>
  <rect x="646" y="1146" width="338" height="6" rx="3" class="raised"/>
  <rect x="710" y="1248" width="210" height="18" rx="9" class="card"/><rect x="745" y="1292" width="140" height="78" rx="14" class="raised"/><rect x="778" y="1392" width="74" height="14" rx="7" class="card"/>
  <rect x="646" y="1470" width="338" height="52" rx="12" class="raised"/><rect x="646" y="1534" width="338" height="52" rx="12" class="raised"/><rect x="646" y="1598" width="338" height="52" rx="12" class="raised"/><rect x="646" y="1662" width="338" height="52" rx="12" class="raised"/>
  <path d="M658 1472h106M658 1536h184M658 1600h138M658 1664h210" stroke="rgba(245,245,245,.025)" stroke-width="48"/>
  <text x="646" y="1785" class="muted small">Skeleton geometry matches the eventual card.</text>

  <!-- 07 SAVE ERROR -->
  <text x="1200" y="1048" class="secondaryPale label">07 · COMMAND · SAVE RETRY</text>
  <use href="#phone-shell" x="1200" y="1070"/>
  <use href="#quiz-header" x="1200" y="1070"/>
  <text x="1395" y="1108" text-anchor="middle" class="secondaryPale label">QUICK RECALL · STEP 1</text><text x="1395" y="1128" text-anchor="middle" class="muted small">3 reviews left</text><rect x="1226" y="1146" width="135" height="6" rx="3" fill="#D8C8CE"/>
  <text x="1395" y="1240" text-anchor="middle" class="text word">電車</text><text x="1395" y="1270" text-anchor="middle" class="muted body" letter-spacing="2">でんしゃ</text>
  <rect x="1226" y="1304" width="338" height="92" rx="14" fill="rgba(202,114,136,.08)" stroke="rgba(202,114,136,.28)"/>
  <circle cx="1252" cy="1331" r="12" fill="none" stroke="#CA7288" stroke-width="1.7"/><path d="M1252 1325v8m0 5v1" stroke="#CA7288" stroke-width="1.7"/>
  <text x="1274" y="1334" class="text body" font-weight="750">Couldn't save your answer</text><text x="1244" y="1365" class="warning small">The card has not advanced. Check your connection.</text>
  <rect x="1226" y="1420" width="338" height="50" rx="12" fill="rgba(216,200,206,.08)" stroke="rgba(216,200,206,.45)"/><text x="1395" y="1451" text-anchor="middle" class="secondaryPale button">phone</text>
  <rect x="1226" y="1490" width="338" height="54" rx="12" fill="#D6E2DF"/><path d="M1357 1510a9 9 0 1 1-1 10m1 0h-7v-7" fill="none" stroke="#30343F" stroke-width="1.8"/><text x="1420" y="1524" text-anchor="middle" class="darkText button">Retry save</text>
  <text x="1226" y="1590" class="muted small">Retry reuses submissionId.</text><text x="1226" y="1613" class="muted small">A duplicate command returns the applied outcome.</text>

  <!-- 08 EXIT CONFIRMATION -->
  <text x="1780" y="1048" class="secondaryPale label">08 · SESSION · EXIT CONFIRMATION</text>
  <use href="#phone-shell" x="1780" y="1070"/>
  <use href="#quiz-header" x="1780" y="1070"/>
  <text x="1975" y="1108" text-anchor="middle" class="secondaryPale label">QUICK RECALL · STEP 1</text><text x="1975" y="1128" text-anchor="middle" class="muted small">3 reviews left</text>
  <text x="1975" y="1240" text-anchor="middle" class="text word" opacity=".34">電車</text><use href="#quiz-options" x="1780" y="1070" opacity=".24"/>
  <rect x="1780" y="1070" width="390" height="760" rx="30" fill="rgba(43,48,60,.62)"/>
  <rect x="1796" y="1406" width="358" height="408" rx="24" class="raised" stroke="rgba(245,245,245,.09)"/>
  <circle cx="1842" cy="1454" r="22" fill="rgba(216,200,206,.12)"/><circle cx="1842" cy="1454" r="9" fill="none" stroke="#D8C8CE" stroke-width="1.8"/><path d="M1842 1448v7l5 3" stroke="#D8C8CE" stroke-width="1.8" fill="none"/>
  <text x="1822" y="1510" class="text h2">Leave this session?</text>
  <text x="1822" y="1546" class="muted body">Completed reviews are saved. Pending quick</text><text x="1822" y="1569" class="muted body">recalls will be dropped, and the new word</text><text x="1822" y="1592" class="muted body">returns in your next session.</text>
  <rect x="1822" y="1632" width="306" height="52" rx="12" fill="#D6E2DF"/><text x="1975" y="1665" text-anchor="middle" class="darkText button">Keep learning</text>
  <rect x="1822" y="1698" width="306" height="52" rx="12" fill="rgba(216,200,206,.10)" stroke="rgba(216,200,206,.20)"/><text x="1975" y="1731" text-anchor="middle" class="muted button">Leave session</text>

  <text x="40" y="1905" class="muted body">Recovery contract: stale-version conflicts silently replace the local snapshot; only actionable persistence failures keep the card visible and ask the learner to retry.</text>
</svg>
