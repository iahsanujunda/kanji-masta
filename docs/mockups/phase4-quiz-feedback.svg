<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1960" viewBox="0 0 1800 1960" role="img" aria-labelledby="title desc">
  <title id="title">Kanji Masta Phase 4 quiz feedback composition</title>
  <desc id="desc">Six dark mobile mockups showing the shared feedback sheet for all five quiz types plus the missing-explanation fallback. Each sheet presents an outcome, a database-backed word identity line, concise AI reasoning, and Continue.</desc>
  <defs>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E4EBE9"/><stop offset="1" stop-color="#C6B0B8"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B303C" flood-opacity="0.42"/></filter>
    <style>
      .canvas{fill:#747C8F}.app{fill:#343A48}.card{fill:#454D5E}.raised{fill:#555E72}.line{stroke:rgba(245,245,245,.08);stroke-width:1}
      .text{fill:#F5F5F5;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.muted{fill:#DFE2E8;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.quiet{fill:#BCC2CD;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
      .primary{fill:#E4EBE9;font-family:"Noto Sans JP",system-ui,sans-serif}.primaryPale{fill:#EEF2F1;font-family:"Noto Sans JP",system-ui,sans-serif}.secondary{fill:#D8C8CE;font-family:"Noto Sans JP",system-ui,sans-serif}.secondaryPale{fill:#E7DCE0;font-family:"Noto Sans JP",system-ui,sans-serif}.warning{fill:#CA7288;font-family:"Noto Sans JP",system-ui,sans-serif}
      .darkText{fill:#30343F;font-family:"Noto Sans JP",system-ui,sans-serif}.title{font-size:28px;font-weight:800;letter-spacing:-.6px}.h1{font-size:26px;font-weight:800;letter-spacing:-.4px}.h2{font-size:19px;font-weight:750}.word{font-size:64px;font-weight:650}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:10px}.label{font-size:11px;font-weight:800;letter-spacing:1.2px}.button{font-size:15px;font-weight:800}
    </style>
    <g id="phone-shell"><rect width="390" height="760" rx="30" class="app" filter="url(#shadow)"/><rect x="1" y="1" width="388" height="758" rx="29" fill="none" stroke="rgba(245,245,245,.09)"/></g>
    <g id="quiz-header">
      <circle cx="40" cy="46" r="20" class="raised"/><path d="m33 39 14 14m0-14-14 14" stroke="#DFE2E8" stroke-width="2" stroke-linecap="round"/>
      <text x="195" y="38" text-anchor="middle" class="secondaryPale label">REVIEW</text><text x="195" y="58" text-anchor="middle" class="muted small">2 reviews left</text>
      <rect x="26" y="76" width="338" height="6" rx="3" class="raised"/><rect x="26" y="76" width="203" height="6" rx="3" fill="#D8C8CE"/>
    </g>
    <g id="continue-green"><rect x="26" y="688" width="338" height="52" rx="12" fill="#D6E2DF"/><text x="195" y="721" text-anchor="middle" class="darkText button">Continue</text></g>
    <g id="continue-red"><rect x="26" y="688" width="338" height="52" rx="12" fill="rgba(202,114,136,.16)" stroke="rgba(202,114,136,.32)"/><text x="195" y="721" text-anchor="middle" class="warning button">Continue</text></g>
    <g id="continue-secondary"><rect x="26" y="688" width="338" height="52" rx="12" fill="rgba(216,200,206,.12)" stroke="rgba(216,200,206,.24)"/><text x="195" y="721" text-anchor="middle" class="secondaryPale button">Continue</text></g>
  </defs>

  <rect width="1800" height="1960" class="canvas"/>
  <rect x="60" y="32" width="38" height="38" rx="10" fill="url(#brand-gradient)"/><path d="M72 58c10-2 15-8 16-17-9 1-15 6-16 17Zm0 0c-2-7-1-13 2-18" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
  <text x="112" y="55" class="text title">Phase 4 — quiz feedback composition</text>
  <text x="112" y="80" class="muted body">One feedback component, five quiz types, and one graceful fallback using the established 390 px session shell.</text>
  <rect x="1538" y="36" width="202" height="30" rx="15" fill="rgba(214,226,223,.13)" stroke="rgba(228,235,233,.28)"/><text x="1639" y="56" text-anchor="middle" class="primaryPale label">UX MOCKUP · AUG 2026</text>

  <!-- 01 MEANING RECALL · CORRECT -->
  <g transform="translate(60 150)">
    <text x="0" y="-22" class="secondaryPale label">01 · MEANING RECALL · CORRECT</text>
    <use href="#phone-shell"/><use href="#quiz-header"/>
    <text x="195" y="126" text-anchor="middle" class="muted label">WHAT DOES THIS WORD MEAN?</text>
    <text x="195" y="222" text-anchor="middle" class="text word">電車</text><text x="195" y="252" text-anchor="middle" class="muted body" letter-spacing="2">でんしゃ</text>
    <rect x="26" y="288" width="338" height="48" rx="12" fill="rgba(214,226,223,.10)" stroke="rgba(214,226,223,.55)"/><text x="195" y="318" text-anchor="middle" class="primaryPale button">train</text>
    <rect x="0" y="376" width="390" height="384" rx="24" fill="#748B86" stroke="rgba(228,235,233,.40)"/>
    <circle cx="48" cy="424" r="18" fill="rgba(228,235,233,.16)"/><path d="m39 424 6 6 13-15" fill="none" stroke="#E4EBE9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="431" class="text h2">Correct!</text>
    <text x="26" y="480" class="text h2">電車</text><text x="76" y="480" class="primaryPale body">· でんしゃ · train</text><line x1="26" y1="502" x2="364" y2="502" stroke="rgba(238,242,241,.14)"/>
    <text x="26" y="535" class="primaryPale label">WHY IT WORKS</text><text x="26" y="568" fill="#EEF2F1" class="body">電 (electricity) + 車 (vehicle) — the compound</text><text x="26" y="591" fill="#EEF2F1" class="body">follows the parts directly.</text>
    <use href="#continue-green"/>
  </g>

  <!-- 02 READING RECOGNITION · INCORRECT -->
  <g transform="translate(705 150)">
    <text x="0" y="-22" class="secondaryPale label">02 · READING RECOGNITION · INCORRECT</text>
    <use href="#phone-shell"/><use href="#quiz-header"/>
    <text x="195" y="126" text-anchor="middle" class="muted label">CHOOSE THE READING</text><text x="195" y="230" text-anchor="middle" class="text word">電車</text>
    <rect x="26" y="288" width="338" height="48" rx="12" fill="rgba(214,226,223,.10)" stroke="rgba(214,226,223,.55)"/><text x="195" y="318" text-anchor="middle" class="primaryPale button">でんしゃ</text>
    <rect x="0" y="376" width="390" height="384" rx="24" fill="#604653" stroke="rgba(202,114,136,.40)"/>
    <circle cx="48" cy="424" r="18" fill="rgba(202,114,136,.12)"/><path d="m39 415 18 18m0-18-18 18" stroke="#CA7288" stroke-width="2" stroke-linecap="round"/><text x="79" y="431" class="text h2">Not quite</text>
    <text x="26" y="480" class="text h2">電車</text><text x="76" y="480" fill="#D58D9F" class="body">· でんしゃ · train</text><line x1="26" y1="502" x2="364" y2="502" stroke="rgba(232,194,203,.12)"/>
    <text x="26" y="535" fill="#D58D9F" class="label">WHY IT WORKS</text><text x="26" y="568" fill="#E8C2CB" class="body">でん is the on-yomi of 電; しゃ is the</text><text x="26" y="591" fill="#E8C2CB" class="body">on-yomi of 車.</text>
    <use href="#continue-red"/>
  </g>

  <!-- 03 REVERSE READING · CORRECT -->
  <g transform="translate(1350 150)">
    <text x="0" y="-22" class="secondaryPale label">03 · REVERSE READING · CORRECT</text>
    <use href="#phone-shell"/><use href="#quiz-header"/>
    <text x="195" y="126" text-anchor="middle" class="muted label">CHOOSE THE WORD</text><text x="195" y="220" text-anchor="middle" class="text h1" letter-spacing="3">でんしゃ</text>
    <rect x="26" y="288" width="338" height="48" rx="12" fill="rgba(214,226,223,.10)" stroke="rgba(214,226,223,.55)"/><text x="195" y="318" text-anchor="middle" class="primaryPale button">電車</text>
    <rect x="0" y="376" width="390" height="384" rx="24" fill="#748B86" stroke="rgba(228,235,233,.40)"/>
    <circle cx="48" cy="424" r="18" fill="rgba(228,235,233,.16)"/><path d="m39 424 6 6 13-15" fill="none" stroke="#E4EBE9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="431" class="text h2">Correct!</text>
    <text x="26" y="480" class="text h2">電車</text><text x="76" y="480" class="primaryPale body">· でんしゃ · train</text><line x1="26" y1="502" x2="364" y2="502" stroke="rgba(238,242,241,.14)"/>
    <text x="26" y="535" class="primaryPale label">WHY IT WORKS</text><text x="26" y="568" fill="#EEF2F1" class="body">しゃ points to 車 — 話 would end in わ,</text><text x="26" y="591" fill="#EEF2F1" class="body">while 気 would end in き.</text>
    <use href="#continue-green"/>
  </g>

  <!-- 04 BOLD WORD MEANING · LEARNED -->
  <g transform="translate(60 1070)">
    <text x="0" y="-22" class="secondaryPale label">04 · BOLD WORD MEANING · LEARNED</text>
    <use href="#phone-shell"/><use href="#quiz-header"/>
    <text x="195" y="126" text-anchor="middle" class="muted label">WHAT DOES THE MARKED WORD MEAN?</text>
    <text x="195" y="194" text-anchor="middle" class="text body">今日、<tspan fill="#E7DCE0" font-weight="800">電車</tspan>遅れてるじゃん。</text><line x1="177" y1="201" x2="214" y2="201" stroke="#C6B0B8" stroke-width="2"/>
    <text x="195" y="229" text-anchor="middle" class="muted small">でんしゃ</text><rect x="26" y="288" width="338" height="48" rx="12" fill="rgba(214,226,223,.10)" stroke="rgba(214,226,223,.55)"/><text x="195" y="318" text-anchor="middle" class="primaryPale button">train</text>
    <rect x="0" y="376" width="390" height="384" rx="24" fill="#748B86" stroke="rgba(228,235,233,.40)"/>
    <circle cx="48" cy="424" r="18" fill="rgba(228,235,233,.16)"/><path d="m39 424 6 6 13-15" fill="none" stroke="#E4EBE9" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="79" y="431" class="text h2">Learned!</text>
    <text x="26" y="480" class="text h2">電車</text><text x="76" y="480" class="primaryPale body">· でんしゃ · train</text><line x1="26" y1="502" x2="364" y2="502" stroke="rgba(238,242,241,.14)"/>
    <text x="26" y="535" class="primaryPale label">WHY IT WORKS</text><text x="26" y="568" fill="#EEF2F1" class="body">The speaker is complaining that their ride is</text><text x="26" y="591" fill="#EEF2F1" class="body">running late.</text>
    <use href="#continue-green"/>
  </g>

  <!-- 05 FILL IN THE BLANK · REVISIT -->
  <g transform="translate(705 1070)">
    <text x="0" y="-22" class="secondaryPale label">05 · FILL IN THE BLANK · REVISIT LATER</text>
    <use href="#phone-shell"/><use href="#quiz-header"/>
    <text x="195" y="126" text-anchor="middle" class="muted label">COMPLETE THE SENTENCE</text><text x="195" y="204" text-anchor="middle" class="text body">＿＿乗り換えどこだっけ？</text>
    <rect x="26" y="288" width="338" height="48" rx="12" fill="rgba(214,226,223,.10)" stroke="rgba(214,226,223,.55)"/><text x="195" y="318" text-anchor="middle" class="primaryPale button">電車</text>
    <rect x="0" y="376" width="390" height="384" rx="24" class="raised" stroke="rgba(216,200,206,.35)"/>
    <circle cx="48" cy="424" r="18" fill="rgba(216,200,206,.12)"/><circle cx="48" cy="424" r="8" fill="none" stroke="#D8C8CE" stroke-width="1.7"/><path d="M48 419v6l4 3" stroke="#D8C8CE" stroke-width="1.7" fill="none"/><text x="79" y="431" class="text h2">We'll revisit this</text>
    <text x="26" y="480" class="text h2">電車</text><text x="76" y="480" class="secondaryPale body">· でんしゃ · train</text><line x1="26" y1="502" x2="364" y2="502" class="line"/>
    <text x="26" y="535" class="secondaryPale label">WHY IT WORKS</text><text x="26" y="568" class="text body">乗り換え is transferring; 急行 and 地下鉄</text><text x="26" y="591" class="text body">name specific services, not the general one.</text>
    <use href="#continue-secondary"/>
  </g>

  <!-- 06 EXPLANATION FALLBACK -->
  <g transform="translate(1350 1070)">
    <text x="0" y="-22" class="secondaryPale label">06 · ANY QUIZ TYPE · NO EXPLANATION</text>
    <use href="#phone-shell"/><use href="#quiz-header"/>
    <text x="195" y="126" text-anchor="middle" class="muted label">WHAT DOES THIS WORD MEAN?</text><text x="195" y="222" text-anchor="middle" class="text word">電車</text><text x="195" y="252" text-anchor="middle" class="muted body" letter-spacing="2">でんしゃ</text>
    <rect x="26" y="288" width="338" height="48" rx="12" fill="rgba(216,200,206,.08)" stroke="rgba(216,200,206,.45)"/><text x="195" y="318" text-anchor="middle" class="secondaryPale button">phone</text>
    <rect x="0" y="376" width="390" height="384" rx="24" class="raised" stroke="rgba(216,200,206,.35)"/>
    <circle cx="48" cy="424" r="18" fill="rgba(216,200,206,.12)"/><path d="M48 415v1m0 6v11" stroke="#D8C8CE" stroke-width="2.3" stroke-linecap="round"/><text x="79" y="431" class="text h2">Not yet</text>
    <text x="26" y="480" class="text h2">電車</text><text x="76" y="480" class="secondaryPale body">· でんしゃ · train</text><line x1="26" y1="502" x2="364" y2="502" class="line"/>
    <text x="26" y="535" class="secondaryPale label">NEXT STEP</text><text x="26" y="568" class="muted body">You'll see this word again before the session</text><text x="26" y="591" class="muted body">ends. No progress is lost.</text>
    <use href="#continue-secondary"/>
  </g>

  <text x="60" y="1905" class="muted body">Contract notes: no separate Answer row; no answer-feedback kanji breakdown; identity omits a blank meaning safely; fixed outcome copy appears only when explanation is absent.</text>
</svg>
