<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1960" viewBox="0 0 1800 1960" role="img" aria-labelledby="title desc">
  <title id="title">Kanji Masta user scan activity drawer</title>
  <desc id="desc">Six dark mobile mockups showing a clean Home page with an unread activity dot, the scan activity bottom drawer, infinite scrolling, and loading, empty, and pagination error states.</desc>
  <defs>
    <linearGradient id="slot-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#849B96"/>
      <stop offset="1" stop-color="#846F77"/>
    </linearGradient>
    <linearGradient id="brand-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E4EBE9"/>
      <stop offset="1" stop-color="#C6B0B8"/>
    </linearGradient>
    <linearGradient id="photo-gradient" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#263747"/>
      <stop offset="1" stop-color="#3B4251"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#2B303C" flood-opacity="0.42"/>
    </filter>
    <style>
      .canvas{fill:#626A7C}.app{fill:#343A48}.card{fill:#454D5E}.raised{fill:#555E72}.line{stroke:rgba(245,245,245,.08);stroke-width:1}
      .text{fill:#F5F5F5;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.muted{fill:#DFE2E8;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}.quiet{fill:#BCC2CD;font-family:"Noto Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif}
      .primary{fill:#E4EBE9;font-family:"Noto Sans JP",system-ui,sans-serif}.primaryPale{fill:#EEF2F1;font-family:"Noto Sans JP",system-ui,sans-serif}.secondary{fill:#D8C8CE;font-family:"Noto Sans JP",system-ui,sans-serif}.secondaryPale{fill:#E7DCE0;font-family:"Noto Sans JP",system-ui,sans-serif}.warning{fill:#CA7288;font-family:"Noto Sans JP",system-ui,sans-serif}
      .darkText{fill:#30343F;font-family:"Noto Sans JP",system-ui,sans-serif}.title{font-size:28px;font-weight:800;letter-spacing:-.6px}.h1{font-size:26px;font-weight:800;letter-spacing:-.4px}.h2{font-size:19px;font-weight:750}.body{font-size:14px}.small{font-size:12px}.tiny{font-size:10px}.label{font-size:11px;font-weight:800;letter-spacing:1.2px}.button{font-size:15px;font-weight:800}
    </style>

    <g id="phone-shell">
      <rect width="390" height="760" rx="30" class="app" filter="url(#shadow)"/>
      <rect x="1" y="1" width="388" height="758" rx="29" fill="none" stroke="rgba(245,245,245,.09)"/>
    </g>

    <g id="bell-icon">
      <path d="M13 20h14c-2-2-3-4-3-8a4 4 0 0 0-8 0c0 4-1 6-3 8Zm6 3h2" fill="none" stroke="#DFE2E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="settings-icon">
      <circle cx="20" cy="16" r="3" fill="none" stroke="#DFE2E8" stroke-width="1.7"/>
      <path d="M20 7v3m0 12v3m9-9h-3m-12 0h-3m15.4-6.4-2.1 2.1m-8.6 8.6-2.1 2.1m12.8 0-2.1-2.1m-8.6-8.6-2.1-2.1" fill="none" stroke="#DFE2E8" stroke-width="1.7" stroke-linecap="round"/>
    </g>

    <g id="home-header-clean">
      <text x="26" y="54" class="text h1">Good evening</text>
      <text x="26" y="77" fill="#B0A103" font-family="system-ui" font-size="13" font-weight="700">You are on a 12 day streak</text>
      <rect x="224" y="29" width="58" height="30" rx="15" fill="rgba(202,114,136,.13)"/>
      <path d="M239 50c-7-7 2-12 0-19 8 5 11 11 7 18-2 4-5 5-7 1Z" fill="none" stroke="#B0A103" stroke-width="1.8"/>
      <text x="262" y="50" text-anchor="middle" fill="#D58D9F" font-family="system-ui" font-size="13" font-weight="800">12</text>
      <circle cx="309" cy="44" r="21" fill="rgba(245,245,245,.035)"/>
      <use href="#bell-icon" x="289" y="28"/>
      <circle cx="355" cy="44" r="21" fill="rgba(245,245,245,.035)"/>
      <use href="#settings-icon" x="335" y="28"/>
    </g>

    <g id="quiz-card">
      <rect x="26" y="112" width="338" height="188" rx="20" fill="url(#slot-gradient)" stroke="rgba(245,245,245,.10)"/>
      <text x="52" y="150" class="primaryPale body" font-weight="750">Ready to quiz</text>
      <text x="52" y="206" class="text" font-family="system-ui" font-size="42" font-weight="850">5</text>
      <text x="88" y="206" class="text h2" opacity=".72">quizzes</text>
      <rect x="52" y="232" width="286" height="48" rx="12" fill="#D6E2DF"/>
      <text x="195" y="263" text-anchor="middle" class="darkText button">Start session</text>
    </g>

    <g id="home-content">
      <use href="#quiz-card"/>
      <rect x="26" y="324" width="338" height="108" rx="18" class="card" stroke="rgba(245,245,245,.09)"/>
      <circle cx="55" cy="355" r="13" fill="rgba(216,200,206,.12)"/>
      <path d="M55 347v16m-8-8h16" stroke="#D8C8CE" stroke-width="1.5" stroke-linecap="round"/>
      <text x="78" y="359" class="secondaryPale label">TODAY'S LESSON</text>
      <text x="46" y="392" class="text body" font-weight="800">Reading station signs with confidence</text>
      <text x="46" y="414" class="muted tiny">3 min read</text>
      <path d="m337 374 7 7-7 7" fill="none" stroke="#BCC2CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="446" width="338" height="82" rx="18" class="card" stroke="rgba(245,245,245,.09)"/>
      <rect x="44" y="463" width="46" height="46" rx="13" fill="rgba(198,176,184,.15)"/>
      <path d="M56 475h22v20H56Zm0 5h22M63 475v20" fill="none" stroke="#D8C8CE" stroke-width="1.5"/>
      <text x="106" y="481" class="text body" font-weight="800">Your Kanji</text>
      <text x="106" y="504" class="primary small">47 learning</text>
      <text x="177" y="504" class="muted small">· 83 familiar</text>
      <path d="m337 481 7 7-7 7" fill="none" stroke="#BCC2CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="26" y="542" width="338" height="82" rx="18" class="card" stroke="rgba(245,245,245,.09)"/>
      <rect x="44" y="559" width="46" height="46" rx="13" fill="rgba(198,176,184,.15)"/>
      <path d="M56 576h22M56 583h17M56 590h13" fill="none" stroke="#D8C8CE" stroke-width="1.6" stroke-linecap="round"/>
      <text x="106" y="578" class="text body" font-weight="800">Dictionary</text>
      <text x="106" y="601" class="muted small">126 saved words</text>
      <path d="m337 577 7 7-7 7" fill="none" stroke="#BCC2CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="capture-button">
      <rect x="26" y="682" width="338" height="58" rx="29" fill="#F5F5F5"/>
      <rect x="42" y="695" width="32" height="32" rx="16" fill="#F5F5F5"/>
      <path d="M51 704h14l3 4h4v12H48v-12h4l3-4Zm9 7a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z" fill="none" stroke="#454D5E" stroke-width="1.5" stroke-linejoin="round"/>
      <text x="208" y="718" text-anchor="middle" fill="#454D5E" font-family="system-ui" font-size="15" font-weight="800">Capture Japanese</text>
    </g>

    <g id="drawer-shell">
      <rect x="0" y="0" width="390" height="760" rx="30" fill="rgba(43,48,60,.58)"/>
      <rect x="0" y="188" width="390" height="572" rx="28 28 30 30" class="card" stroke="rgba(245,245,245,.12)"/>
      <rect x="165" y="201" width="60" height="5" rx="3" fill="#A8AFBD"/>
      <text x="24" y="252" class="text h2">Activity</text>
      <circle cx="344" cy="244" r="20" class="raised"/>
      <path d="m337 237 14 14m0-14-14 14" stroke="#DFE2E8" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="0" y1="270" x2="390" y2="270" class="line"/>
    </g>

    <g id="photo-thumb">
      <rect width="54" height="54" rx="12" fill="url(#photo-gradient)"/>
      <rect x="9" y="16" width="36" height="20" rx="2" fill="#F5F5F5"/>
      <text x="27" y="30" text-anchor="middle" fill="#3B4251" font-family="Noto Sans JP,system-ui" font-size="8" font-weight="800">東京駅</text>
    </g>

    <g id="activity-row-ready">
      <use href="#photo-thumb"/>
      <circle cx="72" cy="12" r="9" fill="rgba(228,235,233,.14)"/>
      <path d="m68 12 3 3 6-7" fill="none" stroke="#E4EBE9" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="88" y="16" class="text body" font-weight="800">Scan ready</text>
      <text x="72" y="39" class="primaryPale small">5 kanji found</text>
      <text x="72" y="55" class="quiet tiny">18 min ago</text>
      <path d="m324 21 7 7-7 7" fill="none" stroke="#BCC2CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="activity-row-analysing">
      <use href="#photo-thumb"/>
      <circle cx="72" cy="12" r="5" fill="#D8C8CE"/>
      <text x="88" y="16" class="text body" font-weight="800">Analysing photo</text>
      <text x="72" y="39" class="secondaryPale small">Safe to close the app</text>
      <text x="72" y="55" class="quiet tiny">Started 3 min ago</text>
      <path d="m324 21 7 7-7 7" fill="none" stroke="#BCC2CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="activity-row-upload">
      <use href="#photo-thumb"/>
      <circle cx="72" cy="12" r="5" fill="#D8C8CE"/>
      <text x="88" y="16" class="text body" font-weight="800">Uploading photo</text>
      <text x="72" y="39" class="primaryPale small">Saved on this device</text>
      <rect x="72" y="48" width="188" height="4" rx="2" class="raised"/>
      <rect x="72" y="48" width="112" height="4" rx="2" fill="#D8C8CE"/>
    </g>

    <g id="activity-row-failed">
      <use href="#photo-thumb"/>
      <circle cx="72" cy="12" r="9" fill="rgba(202,114,136,.13)"/>
      <path d="M72 7v7m0 4v1" stroke="#CA7288" stroke-width="1.7" stroke-linecap="round"/>
      <text x="88" y="16" class="text body" font-weight="800">Scan did not finish</text>
      <text x="72" y="39" class="muted small">Tap to view options</text>
      <text x="72" y="55" class="quiet tiny">Yesterday</text>
      <path d="m324 21 7 7-7 7" fill="none" stroke="#BCC2CD" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <g id="old-ready-row">
      <rect width="46" height="46" rx="11" fill="url(#photo-gradient)"/>
      <circle cx="63" cy="11" r="7" fill="rgba(228,235,233,.14)"/>
      <path d="m60 11 2 2 5-6" fill="none" stroke="#E4EBE9" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="77" y="15" class="text small" font-weight="800">Scan ready</text>
      <text x="63" y="36" class="muted tiny">4 kanji found</text>
      <path d="m324 15 6 6-6 6" fill="none" stroke="#BCC2CD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect width="1800" height="1960" class="canvas"/>
  <rect x="60" y="32" width="38" height="38" rx="10" fill="url(#brand-gradient)"/>
  <path d="M72 58c10-2 15-8 16-17-9 1-15 6-16 17Zm0 0c-2-7-1-13 2-18" fill="none" stroke="#F5F5F5" stroke-width="2" stroke-linecap="round"/>
  <text x="112" y="55" class="text title">Scan activity — updates without taking over Home</text>
  <text x="112" y="80" class="muted body">A durable mobile history for local uploads, active analysis, ready results, and failed scans.</text>
  <rect x="1538" y="36" width="202" height="30" rx="15" fill="rgba(214,226,223,.13)" stroke="rgba(228,235,233,.28)"/>
  <text x="1639" y="56" text-anchor="middle" class="primaryPale label">UX MOCKUP · AUG 2026</text>

  <!-- 01 CLEAN HOME WITH UNSEEN UPDATE -->
  <text x="60" y="128" class="secondaryPale label">01 · HOME · NEW ACTIVITY</text>
  <use href="#phone-shell" x="60" y="150"/>
  <use href="#home-header-clean" x="60" y="150"/>
  <circle cx="377" cy="181" r="5" fill="#E4EBE9" stroke="#343A48" stroke-width="2"/>
  <use href="#home-content" x="60" y="150"/>
  <use href="#capture-button" x="60" y="150"/>
  <path d="M386 181h75v-38h122" fill="none" stroke="#C6B0B8" stroke-width="1.8" stroke-dasharray="5 5"/>
  <text x="520" y="136" class="primaryPale small" font-weight="750">unseen status change</text>
  <text x="86" y="804" class="muted tiny">No scan status cards in the Home content area.</text>

  <!-- ARROW 1 -->
  <path d="M494 530h132" fill="none" stroke="#C6B0B8" stroke-width="2"/>
  <path d="m615 523 12 7-12 7" fill="none" stroke="#D8C8CE" stroke-width="2"/>
  <text x="560" y="510" text-anchor="middle" class="muted small">tap Activity</text>

  <!-- 02 DRAWER OPEN -->
  <text x="705" y="128" class="secondaryPale label">02 · DRAWER · DOT CLEARS ON OPEN</text>
  <use href="#phone-shell" x="705" y="150"/>
  <use href="#home-header-clean" x="705" y="150"/>
  <use href="#home-content" x="705" y="150"/>
  <use href="#drawer-shell" x="705" y="150"/>
  <text x="729" y="450" class="muted label">NOW</text>
  <use href="#activity-row-upload" x="729" y="468"/>
  <line x1="729" y1="534" x2="1069" y2="534" class="line"/>
  <use href="#activity-row-analysing" x="729" y="550"/>
  <line x1="729" y1="620" x2="1069" y2="620" class="line"/>
  <text x="729" y="651" class="muted label">RECENT</text>
  <rect x="719" y="665" width="362" height="78" rx="14" fill="rgba(214,226,223,.055)" stroke="rgba(228,235,233,.20)"/>
  <use href="#activity-row-ready" x="729" y="677"/>
  <use href="#activity-row-failed" x="729" y="771"/>
  <text x="731" y="880" class="muted tiny">Opening the drawer clears the header dot immediately.</text>

  <!-- ARROW 2 -->
  <path d="M1139 530h132" fill="none" stroke="#C6B0B8" stroke-width="2"/>
  <path d="m1260 523 12 7-12 7" fill="none" stroke="#D8C8CE" stroke-width="2"/>
  <text x="1205" y="510" text-anchor="middle" class="muted small">scroll inside drawer</text>

  <!-- 03 INFINITE SCROLL -->
  <text x="1350" y="128" class="secondaryPale label">03 · DRAWER · OLDER ACTIVITY</text>
  <use href="#phone-shell" x="1350" y="150"/>
  <use href="#home-header-clean" x="1350" y="150"/>
  <use href="#home-content" x="1350" y="150"/>
  <use href="#drawer-shell" x="1350" y="150"/>
  <text x="1374" y="450" class="muted label">EARLIER</text>
  <use href="#old-ready-row" x="1374" y="470"/>
  <text x="1658" y="492" text-anchor="end" class="quiet tiny">Aug 2</text>
  <line x1="1374" y1="532" x2="1714" y2="532" class="line"/>
  <use href="#old-ready-row" x="1374" y="548"/>
  <text x="1658" y="570" text-anchor="end" class="quiet tiny">Jul 28</text>
  <line x1="1374" y1="610" x2="1714" y2="610" class="line"/>
  <use href="#old-ready-row" x="1374" y="626"/>
  <text x="1658" y="648" text-anchor="end" class="quiet tiny">Jul 21</text>
  <line x1="1374" y1="688" x2="1714" y2="688" class="line"/>
  <use href="#old-ready-row" x="1374" y="704"/>
  <text x="1658" y="726" text-anchor="end" class="quiet tiny">Jul 14</text>
  <circle cx="1535" cy="797" r="11" fill="none" stroke="#3f3f46" stroke-width="3"/>
  <path d="M1535 786a11 11 0 0 1 10 6" fill="none" stroke="#D8C8CE" stroke-width="3" stroke-linecap="round"/>
  <text x="1557" y="801" class="muted small">Loading earlier scans</text>
  <text x="1374" y="871" class="quiet tiny">The next page loads near the end of the drawer list.</text>

  <!-- ROW TRANSITION -->
  <path d="M1545 940v52H255v45" fill="none" stroke="#C6B0B8" stroke-width="2" stroke-dasharray="7 7"/>
  <path d="m248 1025 7 12 7-12" fill="none" stroke="#D8C8CE" stroke-width="2"/>
  <text x="900" y="977" text-anchor="middle" class="muted small">Supporting states keep the same drawer geometry, close control, and scroll behavior.</text>

  <!-- 04 INITIAL LOADING -->
  <text x="60" y="1048" class="secondaryPale label">04 · DRAWER · FIRST LOAD</text>
  <use href="#phone-shell" x="60" y="1070"/>
  <use href="#home-header-clean" x="60" y="1070"/>
  <use href="#home-content" x="60" y="1070"/>
  <use href="#drawer-shell" x="60" y="1070"/>
  <rect x="84" y="1370" width="76" height="11" rx="5" fill="#272733"/>
  <rect x="84" y="1404" width="54" height="54" rx="12" fill="#555E72"/>
  <rect x="154" y="1408" width="132" height="12" rx="6" fill="#626C81"/>
  <rect x="154" y="1432" width="188" height="9" rx="4" fill="#626C81"/>
  <rect x="84" y="1482" width="54" height="54" rx="12" fill="#555E72"/>
  <rect x="154" y="1486" width="154" height="12" rx="6" fill="#626C81"/>
  <rect x="154" y="1510" width="121" height="9" rx="4" fill="#626C81"/>
  <rect x="84" y="1560" width="54" height="54" rx="12" fill="#555E72"/>
  <rect x="154" y="1564" width="116" height="12" rx="6" fill="#626C81"/>
  <rect x="154" y="1588" width="176" height="9" rx="4" fill="#626C81"/>
  <text x="84" y="1690" class="quiet tiny">Rows reserve their final size while activity loads.</text>

  <!-- 05 EMPTY -->
  <text x="705" y="1048" class="secondaryPale label">05 · DRAWER · NO SCANS YET</text>
  <use href="#phone-shell" x="705" y="1070"/>
  <use href="#home-header-clean" x="705" y="1070"/>
  <use href="#home-content" x="705" y="1070"/>
  <use href="#drawer-shell" x="705" y="1070"/>
  <circle cx="900" cy="1450" r="40" fill="rgba(216,200,206,.10)"/>
  <path d="M880 1440h27l6 7h7v22h-40v-22h7l6-7Zm20 11a7 7 0 1 0 0 14 7 7 0 0 0 0-14Z" fill="none" stroke="#D8C8CE" stroke-width="2" stroke-linejoin="round"/>
  <text x="900" y="1524" text-anchor="middle" class="text h2">No scan activity yet</text>
  <text x="900" y="1552" text-anchor="middle" class="muted small">Your saved and analysed photos will appear here.</text>

  <!-- 06 PAGINATION ERROR -->
  <text x="1350" y="1048" class="secondaryPale label">06 · DRAWER · OLDER PAGE RETRY</text>
  <use href="#phone-shell" x="1350" y="1070"/>
  <use href="#home-header-clean" x="1350" y="1070"/>
  <use href="#home-content" x="1350" y="1070"/>
  <use href="#drawer-shell" x="1350" y="1070"/>
  <text x="1374" y="1370" class="muted label">EARLIER</text>
  <use href="#old-ready-row" x="1374" y="1390"/>
  <text x="1658" y="1412" text-anchor="end" class="quiet tiny">Aug 2</text>
  <line x1="1374" y1="1452" x2="1714" y2="1452" class="line"/>
  <use href="#old-ready-row" x="1374" y="1468"/>
  <text x="1658" y="1490" text-anchor="end" class="quiet tiny">Jul 28</text>
  <rect x="1374" y="1552" width="340" height="96" rx="15" fill="rgba(202,114,136,.055)" stroke="rgba(202,114,136,.20)"/>
  <circle cx="1402" cy="1581" r="9" fill="rgba(202,114,136,.14)"/>
  <path d="M1402 1576v6m0 4v1" stroke="#CA7288" stroke-width="1.6" stroke-linecap="round"/>
  <text x="1420" y="1585" class="text small" font-weight="800">Could not load earlier scans</text>
  <rect x="1392" y="1604" width="304" height="32" rx="9" class="raised"/>
  <text x="1544" y="1625" text-anchor="middle" class="secondaryPale small" font-weight="800">Try again</text>
  <text x="1374" y="1686" class="quiet tiny">Already loaded activity stays visible above the retry.</text>

  <text x="60" y="1905" class="muted body">Interaction contract: opening Activity clears the dot; local captures and server scans share one chronological list; older pages load within the drawer.</text>
</svg>
